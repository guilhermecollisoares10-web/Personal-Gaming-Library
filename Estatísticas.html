	<script>
	const painel = document.getElementById('painel');
	const jogos = JSON.parse(localStorage.getItem("bibliotecaJogos")) || {};
	const estatisticas = JSON.parse(localStorage.getItem("estatisticas")) || {};
	let jogo = []
	let horas = []
	horasJogadas = 0
	function calcularEstatisticas() {
	jogo = []
	horas = []
	horasJogadas = 0
	console.log(jogos);
	for ([nome, dados] of Object.entries(jogos)) {
	jogo.push(nome);
	horas.push(parseInt(dados.tempo));
	horasJogadas = horas.reduce((acc, num) => acc + num, 0)
	if (nome in estatisticas) {
		print("Jogo ja registrado");
		}
	else {
	estatisticas[nome] = {
		Jogo: nome,
		HorasRegistradas: dados.tempo
		}
	}
	}
	console.log(jogo, horas)
	painel.innerHTML = `Número de jogos registrados: ${jogo.length} jogos; <br>
	Jogos registrados: ${jogo.join('--')}; <br>
	Horas totais jogadas: ${horasJogadas} horas; <br>
	${JSON.stringify(estatisticas)};
	`
	}
	calcularEstatisticas()
	console.log(estatisticas)
	</script>
