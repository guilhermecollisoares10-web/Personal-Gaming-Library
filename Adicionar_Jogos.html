	<style>

	}
	
	.card-jogo {
    width: 180px;
    height: 260px;
    background: #1e1e1e;
    color: var(--tx-color2);
    border: none;
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    flex-shrink: 0;

    align-items: center;

	<body>
	<h1 class="bar"><a style="color: var(--tx-color1);" href="biblioteca de jogos.html"><div class="bib" >Biblioteca de Jogos</div></a></h1>
	<h1 style="position: relative; left: 500px;top: 150px;"> Adicionar/ Atualizar/ Remover Jogo da Biblioteca</h1>	
	<div class="container">
	<p>Não é necessário que todas as informações sejam preenchidas para adicionar um jogo, é possivel apenas colocar aquilo que voce deseja e, se preciso, é possivel adicionar depois</p>
		<label for="nome">Digite o nome do jogo:</label>
		<input type="text" id="nome" placeholder="Digite o nome"><br>
		<label for="genero">Digite o genero do jogo:</label>
		<input type="text" id="genero" placeholder="Digite o genero"><br>
		<select id="sta" style="padding: 30px; background-color: black; color: var(--tx-color1);border-radius: 13px; cursor: pointer;">
		<option value="nulo">Selecione um status:</option>
		<option id="zer">Zerado</option>
		<option id="jog">jogando</option>
		<option id="nun">Nunca Joguei</option>
		</select><br>
		<label for="not">Digite a nota para o jogo:</label>
		<input type="text" id="not" placeholder="Digite a nota"><br>
		<label for="dev">Digite o dev do jogo:</label>
		<input type="text" id="dev" placeholder="Digite a desenvolvedora"><br>		
		<label for="temp">Digite o tempo jogado:</label>
		<input type="text" id="temp" placeholder="Digite o tempo"><br>
		<label for="lan">Digite o ano em que o jogo foi lançado:</label>
		<input type="text" id="lan" placeholder="Digite o ano de lancamento do jogo"><br>
		<label for="img">Selecione uma imagem para o jogo:</label>
		<input type="text" id="img" placeholder="Digite o codigo da imagem"><br>
		<select id="sel" style="padding: 30px; background-color: black; color: var(--tx-color1);border-radius: 13px; cursor: pointer;">
		</select>
		<div class="buttons" >
			<button class="cards" style="margin-left: 20px; background-color: #314c53;width: 150px;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="add">Adicionar/atualizar</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53; padding: 20px;color: var(--tx-color1); border: 4px var(--tx-color1) solid;" id="exc" >Excluir</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="exi" >Exibir</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="limp" >Limpar lista</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="show" >Mostrar Cards</button>
		</div>
		<p class="panel" style="padding: 70px;color: var(--tx-color1);" id="painel"></p>
	</div>
	<script>		
		let jogos = JSON.parse(localStorage.getItem("bibliotecaJogos")) || {};
		let adicionar = document.getElementById('add')
		let atualizar = document.getElementById('atu')
		let excluir = document.getElementById('exc')
		let exibir = document.getElementById('exi')
		let limpar = document.getElementById('limp')
		let salvar = document.getElementById('sal')
		let mostrar = document.getElementById('show')
		let painel = document.getElementById('painel')
		let situação_atual = 'nulo'
		// Criamos o objeto vazio
		


		function mostrarJogosBonito() {
			painel.innerHTML = ""; // limpa o painel

			for (let [nome, dados] of Object.entries(jogos)) {
				painel.innerHTML += `
					<p>
						<strong>${nome}</strong><br>
						Gênero: ${dados.genero}<br>
						Desenvolvedora: ${dados.desenvolvedora}<br>
						Nota: ${dados.nota}<br>
						Tempo: ${dados.tempo}<br>
						lancamento: ${dados.lancamento}<br>
						Codigo: ${dados.codigo}<br>
						Status: ${dados.status}
					</p>
					<hr>
				`;
			}
		}
		
		
		function cleanInput() {
		document.getElementById('nome').value = '';
		  document.getElementById('genero').value = '';
		  document.getElementById('dev').value = '';
		  document.getElementById('not').value = '';
		  document.getElementById('temp').value = '';
		  document.getElementById('lan').value = '';
		  document.getElementById('img').value = '';
		  document.getElementById('sta').value = 'nulo';
		}
		function adicionarJogo(nome, genero, desenvolvedora, codigo, tempo, data, nota, sta) {
		  if (jogos[nome]) {
			console.log(`'${nome}' já registrado. Atualizando dados...`);
			

		  } else {
			console.log(`Adicionando '${nome}' à biblioteca...`);
		  }

		  // Em JS criamos as propriedades diretamente no objeto
		  jogos[nome] = {
			genero: genero,
			desenvolvedora: desenvolvedora,
			nota: nota,
			tempo: tempo,
			lancamento: data,
			codigo: codigo,
			status: sta
		  };
			localStorage.setItem("bibliotecaJogos", JSON.stringify(jogos));
		}
		
		
		function excluirJogos(nome) {
		if (jogos[nome]) {
			delete jogos[nome]
			console.log('Jogo removido com sucesso')
			localStorage.setItem("bibliotecaJogos", JSON.stringify(jogos));

		}
		else {
			console.log('Jogo não encontrado, deseja adiciona-lo?')
		}
		}
		
		function pegarValores() {
		let JogoAtual = document.getElementById('nome').value;
		let Genero = document.getElementById('genero').value;
		let Dev = document.getElementById('dev').value;
		let Not = document.getElementById('not').value;
		let Tempo = document.getElementById('temp').value;
		let Lan = document.getElementById('lan').value;
		let Img = document.getElementById('img').value;
		let Sta = document.getElementById('sta').value;
		let valoresBrutos = {
		jogo: JogoAtual,
		genero: Genero,
		desenvolvedora: Dev,
		nota: Not,
		status: Sta,
		tempo: Tempo,
		lançamento: Lan,
		img: Img
		}
		let valores = {}
		let listateste = [JogoAtual, Genero, Dev, Img, Tempo, Lan, Not, Sta];
		for (let [item, valor] of Object.entries(valoresBrutos)) {
			if (valor !== ''){
			valores[item] = "Preenchido"
			}
			else {
			valores[item] = "Vazio"
			}
		}
		return {
			valores,
			listateste
		}
		}
		
		adicionar.addEventListener('click', function() {
		let JogoAtual = document.getElementById('nome').value;
		let resultado = pegarValores();   
		let valores = resultado.valores;  
		console.log(valores)
		let lista = resultado.listateste; 
		let preenchidos = []
		let faltantes = []
		for (let [campo, valor] of Object.entries(valores)) {
			if (valor == "Preenchido") {
				preenchidos.push(campo);
			} 
			else {
				faltantes.push(campo);
			}
		}

		console.log(preenchidos)
		console.log(faltantes)
		adicionarJogo(...lista)
		painel.innerHTML = `Informações para ${JogoAtual} Adicionadas <br> Informações faltantes para ${JogoAtual}: ${faltantes.join(", ")}`;
		cleanInput()
		});

		
		excluir.addEventListener('click', function() {
		let JogoAtual = document.getElementById('nome').value;
		let Genero = document.getElementById('genero').value;
		let Dev = document.getElementById('dev').value;
		let Not = document.getElementById('not').value;
		let Tempo = document.getElementById('temp').value;
		let Lan = document.getElementById('lan').value;
		let Img = document.getElementById('img').value;
		let Sta = document.getElementById('sta').value = '';
		if (JogoAtual !== '') {
			excluirJogos(JogoAtual);
			console.log('Jogo excluído com sucesso!')
			console.log(jogos);
			painel.textContent = `Jogo '${JogoAtual}' excluído com sucesso!`
			cleanInput()
		}
		});
		exibir.addEventListener('click', mostrarJogosBonito);
		limpar.addEventListener('click', function () {
    localStorage.removeItem("bibliotecaJogos");
    alert("Biblioteca limpa!");
    location.reload(); 
});
	mostrar.addEventListener('click', () => location.reload());
function carregarSelect() {
    const jogos = JSON.parse(localStorage.getItem("bibliotecaJogos")) || {}; // <-- aqui
    const select = document.getElementById("sel");

    select.innerHTML = '<option value="">Preencher automaticamente</option>';

    for (let [nome, dados] of Object.entries(jogos)) {
        const option = document.createElement("option");
        option.value = nome;
        option.textContent = nome;
        select.appendChild(option);
    }
}



carregarSelect();

document.getElementById("sel").addEventListener("change", function() {
    const nomeSelecionado = this.value;
    const jogos = JSON.parse(localStorage.getItem("bibliotecaJogos")) || {}; // <-- aqui

    const dados = jogos[nomeSelecionado];

    if (dados) {
        document.getElementById("nome").value = nomeSelecionado;
        document.getElementById("img").value = dados.codigo;
        document.getElementById("genero").value = dados.genero;
        document.getElementById("temp").value = dados.tempo;
        document.getElementById("lan").value = dados.lancamento;
        document.getElementById("not").value = dados.nota;
        document.getElementById("dev").value = dados.desenvolvedora;
		document.getElementById("sta").value = dados.status;
    }
});



function mostrarJogosComoCards() {
    painel.innerHTML = "";

    let container = document.createElement("div");
    container.className = "linha-jogos";

    for (let [nome, dados] of Object.entries(jogos)) {

        // contêiner externo que agrupa nome + card
        let jogoContainer = document.createElement("div");
        jogoContainer.className = "jogo-container";


        let nomeDiv = document.createElement("div");
        nomeDiv.className = "nome-jogo";
        nomeDiv.textContent = nome;


        let card = document.createElement("button");
        card.className = "card-jogo";

       card.innerHTML = `
    <img src="${dados.codigo}" class="imagem-real">
`;

        card.addEventListener("click", function() {
            window.location.href = `jogo.html?nome=${encodeURIComponent(nome)}`;

        });

        // montar estrutura
        jogoContainer.appendChild(nomeDiv);
        jogoContainer.appendChild(card);

        container.appendChild(jogoContainer);
    }

    painel.appendChild(container);
}


mostrarJogosComoCards()
		console.log(jogos)
	</script>
	</body>
</html>
