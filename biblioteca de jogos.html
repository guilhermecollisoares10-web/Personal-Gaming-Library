			<script>
			document.addEventListener("DOMContentLoaded", function () {
				const button = document.button;
				const body = document.body;
				const btnd = document.getElementById('btndk');
				const btnl = document.getElementById('btnlg');
				const cfg  = document.getElementById('btnc');
				const con  = document.getElementById('cont');
				
				function mostrarJogosNaBiblioteca() {
				const painel = document.getElementById("painel");
				painel.innerHTML = "";

				const jogos = JSON.parse(localStorage.getItem("bibliotecaJogos")) || {};

				for (let [nome, dados] of Object.entries(jogos)) {

					let jogoDiv = document.createElement("div");
					jogoDiv.className = "jg1"; // usa seu estilo atual

					let nomeDiv = document.createElement("div");
					nomeDiv.className = "nm1";
					nomeDiv.textContent = nome;

					let link = document.createElement("a");
					link.href = `jogo.html?nome=${encodeURIComponent(nome)}`;

					let img = document.createElement("img");
					img.src = dados.codigo;
					img.style.width = "13vw";
					img.style.height = "11vw";
					img.style.borderRadius = "11px";

					link.appendChild(img);
					jogoDiv.appendChild(nomeDiv);
					jogoDiv.appendChild(link);

					painel.appendChild(jogoDiv);
					}
				}

				
				// Nome da página atual (ex: "biblioteca de jogos.html")
				const page = location.pathname.split("/").pop();

				// Chave única para cada página
				const key = "theme_" + page;

				// Carregar tema salvo
				const savedTheme = localStorage.getItem(key);

				if (savedTheme === "dark") {
					body.classList.add("dark-mode");
					body.classList.remove("light-mode");
				} else {
					body.classList.add("light-mode");
					body.classList.remove("dark-mode");
				}

				// Botão modo escuro
				btnd.addEventListener("click", function () {
					body.classList.remove("light-mode");
					body.classList.add("dark-mode");
					localStorage.setItem(key, "dark");
				});

				// Botão modo claro
				btnl.addEventListener("click", function () {
					body.classList.remove("dark-mode");
					body.classList.add("light-mode");
					localStorage.setItem(key, "light");
				});

				// Mostrar/ocultar configurações
				cfg.addEventListener("click", function () {
					con.classList.toggle("show");
				});
				
				mostrarJogosNaBiblioteca();

			});
			</script>
